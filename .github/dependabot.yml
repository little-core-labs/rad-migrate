version: 2

updates:
  # Python dependencies. yt-dlp in particular needs to stay current — YouTube
  # changes break extraction regularly, and an out-of-date yt-dlp is the single
  # most common cause of downloads silently dropping to low quality.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
